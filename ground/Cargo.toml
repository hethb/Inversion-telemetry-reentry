[package]
name = "ground"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
clap = { version = "4.6.9", features = ["derive"] }
futures-util = "0.3.34"
proto = { version = "0.1.0", path = "../proto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sim = { version = "0.1.0", path = "../sim" }
tokio = { version = "1.54.1", features = ["full"] }
